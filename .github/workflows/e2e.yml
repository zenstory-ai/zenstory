name: E2E Tests

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily (nightly)
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        required: true
        default: 'default'
        type: choice
        options:
          - full
          - default
          - nightly
          - release
          - smoke

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      ci: ${{ steps.scope.outputs.ci }}
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Detect changed paths for push runs
      if: github.event_name == 'push'
      id: filter
      uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
      with:
        filters: |
          server_backend:
            - 'apps/server/**'
          web_frontend:
            - 'apps/web/**'
          ci:
            - '.github/workflows/**'
            - '.github/actions/**'
            - 'scripts/ci/**'

    - name: Resolve validated E2E scope
      id: scope
      env:
        EVENT_NAME: ${{ github.event_name }}
        FILTER_BACKEND: ${{ steps.filter.outputs.server_backend }}
        FILTER_FRONTEND: ${{ steps.filter.outputs.web_frontend }}
        FILTER_CI: ${{ steps.filter.outputs.ci }}
      run: |
        if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
          backend=true
          frontend=true
          ci=true
        else
          backend="$FILTER_BACKEND"
          frontend="$FILTER_FRONTEND"
          ci="$FILTER_CI"
        fi
        for value in "$backend" "$frontend" "$ci"; do
          [[ "$value" == "true" || "$value" == "false" ]] || {
            echo "::error::Malformed paths-filter output: ${value:-empty}"
            exit 1
          }
        done
        {
          echo "backend=$backend"
          echo "frontend=$frontend"
          echo "ci=$ci"
        } >> "$GITHUB_OUTPUT"

  e2e-test:
    needs: detect-changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Whole-suite lanes (push, default, full) split by test count into 8
      # contiguous shards; Playwright shards are not duration-balanced, and the
      # slow points/projects files are adjacent, so fewer shards leave one
      # shard on the critical path. Nightly (schedule), release and smoke run
      # fixed file lists on a single chromium "1/1" job; only the full lane
      # adds Firefox.
      matrix:
        browser: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'full') && fromJson('["chromium", "firefox"]') || fromJson('["chromium"]') }}
        shard: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.suite == 'full' || github.event.inputs.suite == 'default'))) && fromJson('["1/8", "2/8", "3/8", "4/8", "5/8", "6/8", "7/8", "8/8"]') || fromJson('["1/1"]') }}
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: zenstory_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup frontend
      uses: ./.github/actions/setup-frontend

    - name: Setup backend
      uses: ./.github/actions/setup-backend

    - name: Install Playwright browsers
      run: |
        cd apps/web
        # The shared authentication setup project uses Chromium even when the
        # requested test project is Firefox, so both executables are required
        # for Firefox matrix jobs.
        if [ "${{ matrix.browser }}" = "chromium" ]; then
          pnpm exec playwright install --with-deps chromium
        else
          pnpm exec playwright install --with-deps chromium ${{ matrix.browser }}
        fi

    - name: Run E2E tests
      run: |
        cd apps/web
        if [ "${{ github.event_name }}" == "push" ]; then
          pnpm exec playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}
        elif [ "${{ github.event_name }}" == "schedule" ] || [ "${{ github.event.inputs.suite }}" == "nightly" ]; then
          if [ "${{ matrix.shard }}" != "1/1" ] || [ "${{ matrix.browser }}" != "chromium" ]; then
            echo "Nightly lane runs on a single chromium shard only for extended tests. Skipping browser=${{ matrix.browser }} shard=${{ matrix.shard }}."
            exit 0
          fi
          E2E_ENABLE_VERSION_HISTORY_E2E=true \
          E2E_ENABLE_SKILL_CREATE_E2E=true \
          pnpm exec playwright test e2e/versions.spec.ts e2e/skills.spec.ts e2e/skills-flow.spec.ts --project=${{ matrix.browser }}
        elif [ "${{ github.event.inputs.suite }}" == "full" ]; then
          E2E_ENABLE_VERSION_HISTORY_E2E=true \
          E2E_ENABLE_SKILL_CREATE_E2E=true \
          E2E_ENABLE_CHAT_E2E=true \
          E2E_ENABLE_CONCURRENT_E2E=true \
          E2E_ENABLE_DEEP_LINK_E2E=true \
          E2E_ENABLE_ERROR_RECOVERY_E2E=true \
          E2E_ENABLE_EXPORT_E2E=true \
          E2E_ENABLE_FILES_E2E=true \
          E2E_ENABLE_FILE_SEARCH_E2E=true \
          E2E_ENABLE_MOCKED_CHAT=true \
          E2E_ENABLE_VOICE_INPUT_E2E=true \
          E2E_ENABLE_VISUAL_REGRESSION_E2E=true \
          E2E_ENABLE_PERFORMANCE_E2E=true \
          E2E_ENABLE_LARGE_DOCUMENT_E2E=true \
          E2E_MAX_FAILURES=0 \
          pnpm exec playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}
        elif [ "${{ github.event.inputs.suite }}" == "release" ]; then
          if [ "${{ matrix.shard }}" != "1/1" ]; then
            echo "Release lane runs on single shard only. Skipping shard ${{ matrix.shard }}."
            exit 0
          fi
          E2E_ENABLE_VISUAL_REGRESSION_E2E=true \
          E2E_ENABLE_PERFORMANCE_E2E=true \
          E2E_ENABLE_LARGE_DOCUMENT_E2E=true \
          E2E_ENABLE_CONCURRENT_E2E=true \
          pnpm exec playwright test e2e/visual.spec.ts e2e/performance.spec.ts e2e/large-document.spec.ts e2e/concurrent.spec.ts --project=${{ matrix.browser }}
        elif [ "${{ github.event.inputs.suite }}" == "smoke" ]; then
          pnpm exec playwright test e2e/smoke.spec.ts --project=${{ matrix.browser }}
        else
          pnpm exec playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}
        fi
      env:
        CI: true
        PLAYWRIGHT_EXTERNAL_BACKEND: "1"
        E2E_TEST_EMAIL: e2e-test@example.com
        E2E_TEST_PASSWORD: E2eTestPassword123!
        E2E_TEST_USERNAME: e2e_test_user

    - name: Merge Shard Reports
      if: always()
      run: |
        cd apps/web
        if [ -d ./blob-report ] && [ -n "$(find ./blob-report -mindepth 1 -maxdepth 1 -print -quit)" ]; then
          pnpm exec playwright merge-reports --reporter html ./blob-report
        else
          echo "No shard reports generated for this job, skipping merge."
        fi

    - name: Upload Playwright report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: failure()
      with:
        # matrix.shard contains "/" (for example "1/8"), which is not valid in
        # artifact names. job-index is stable and filesystem-safe.
        name: playwright-report-${{ matrix.browser }}-${{ strategy.job-index }}
        path: apps/web/playwright-report/
        retention-days: 7

  e2e-summary:
    runs-on: ubuntu-latest
    needs: [detect-changes, e2e-test]
    if: always()
    steps:
    - name: Checkout result validator
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Check E2E results
      env:
        DETECT_CHANGES_RESULT: ${{ needs['detect-changes'].result }}
        BACKEND_CHANGED: ${{ needs['detect-changes'].outputs.backend }}
        FRONTEND_CHANGED: ${{ needs['detect-changes'].outputs.frontend }}
        CI_CHANGED: ${{ needs['detect-changes'].outputs.ci }}
        EVENT_NAME: ${{ github.event_name }}
        E2E_TEST_RESULT: ${{ needs['e2e-test'].result }}
      run: node scripts/ci/check-workflow-results.mjs e2e
