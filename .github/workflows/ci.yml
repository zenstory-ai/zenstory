name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.server_backend }}
      frontend: ${{ steps.filter.outputs.web_frontend }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Detect changed paths
      id: filter
      uses: dorny/paths-filter@v3
      with:
        filters: |
          server_backend:
            - 'apps/server/**'
          web_frontend:
            - 'apps/web/**'
          ci:
            - '.github/workflows/**'
            - '.github/actions/**'
            - 'scripts/ci/**'

  frontend-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup frontend
      uses: ./.github/actions/setup-frontend

    - name: Check CSS design token usage
      run: |
        cd apps/web
        pnpm lint:tokens

    - name: Check i18n defaultValue key coverage
      run: |
        cd apps/web
        pnpm lint:i18n-keys

    - name: Run ESLint
      run: |
        cd apps/web
        pnpm lint

  ci-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install yamllint
      run: |
        python -m pip install --upgrade pip
        pip install yamllint

    - name: Lint CI workflows
      run: |
        yamllint .github/workflows/ .github/actions/

  backend-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services: &service-configs
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: zenstory_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd apps/server
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff

    - name: Run ruff
      run: |
        cd apps/server
        ruff check agent/ api/ services/

    - name: Create test environment file
      run: |
        cd apps/server
        cat > .env.test << EOF
        DATABASE_URL=postgresql://test:test@localhost:5433/zenstory_test
        REDIS_URL=redis://localhost:6380/1
        OPENAI_API_KEY=test-key-for-ci-testing
        JWT_SECRET_KEY=test-secret-key-min-32-characters-for-ci-testing
        REDEMPTION_CODE_HMAC_SECRET=test-hmac-secret-min-32-characters-for-ci
        ZHIPU_EMBEDDINGS_API_KEY=skip-vector-tests-in-ci
        EOF

    - name: Run unit tests with pytest
      run: |
        cd apps/server
        pytest --cov=. --cov-report=xml --cov-report=term --cov-fail-under=80 --durations=15 -v

    - name: Run flow tests
      run: |
        cd apps/server
        pytest tests/test_flows -v --maxfail=1

    - name: Register every production Prefect deployment
      working-directory: apps/server
      run: |
        set -euo pipefail
        prefect server start --host 127.0.0.1 --port 4200 > /tmp/prefect-deploy.log 2>&1 &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true' EXIT

        for attempt in {1..30}; do
          if curl --fail --silent http://127.0.0.1:4200/api/health > /dev/null; then
            break
          fi
          if [[ "$attempt" == "30" ]]; then
            cat /tmp/prefect-deploy.log
            exit 1
          fi
          sleep 1
        done

        export PREFECT_API_URL=http://127.0.0.1:4200/api
        prefect work-pool create zenstory-pool --type process
        prefect deploy --all
        python scripts/prefect_deployments_contract.py

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./apps/server/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  prefect-compatibility:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.ci == 'true'
    name: Prefect compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: zenstory_prefect_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Create the Prefect 3.4.19 database schema
      env:
        PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://test:test@localhost:5434/zenstory_prefect_test
      run: |
        python -m pip install --upgrade pip
        pip install \
          "prefect==3.4.19" \
          "fastapi<0.116" \
          asyncpg \
          psycopg2-binary
        prefect server database upgrade -y

    - name: Upgrade to the production Prefect compatibility pair
      run: |
        pip install --upgrade \
          "$(grep '^prefect==' apps/server/requirements.txt)" \
          "$(grep '^fastapi==' apps/server/requirements.txt)" \
          asyncpg \
          psycopg2-binary
        python -c 'import fastapi, prefect; assert prefect.__version__ == "3.6.28"; assert fastapi.__version__ == "0.123.7"'

    - name: Upgrade the old schema and exercise server API, client, task, and flow
      env:
        PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://test:test@localhost:5434/zenstory_prefect_test
      run: |
        set -euo pipefail
        prefect server database upgrade -y
        prefect server start --host 127.0.0.1 --port 4200 > /tmp/prefect-contract.log 2>&1 &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true' EXIT

        for attempt in {1..30}; do
          if curl --fail --silent http://127.0.0.1:4200/api/health > /dev/null; then
            break
          fi
          if [[ "$attempt" == "30" ]]; then
            cat /tmp/prefect-contract.log
            exit 1
          fi
          sleep 1
        done

        PREFECT_API_URL=http://127.0.0.1:4200/api \
          python apps/server/scripts/prefect_contract.py

  production-images:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.ci == 'true'
    name: Production image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: api-python-3.13
          dockerfile: apps/server/Dockerfile
          context: apps/server
        - name: prefect-server-python-3.11
          dockerfile: apps/server/docker/Dockerfile.prefect-server
          context: .
        - name: prefect-worker-python-3.11
          dockerfile: apps/server/docker/Dockerfile.prefect-worker
          context: .
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build production image
      run: docker build --file "${{ matrix.dockerfile }}" --tag "zenstory-${{ matrix.name }}:ci" "${{ matrix.context }}"

  frontend-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup frontend
      uses: ./.github/actions/setup-frontend

    - name: Run frontend tests with coverage
      run: |
        cd apps/web
        pnpm test:coverage

    - name: Upload frontend coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./apps/web/coverage/lcov.info
        flags: frontend
        name: frontend-coverage
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  frontend-build:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup frontend
      uses: ./.github/actions/setup-frontend

    - name: Build with typecheck
      run: |
        cd apps/web
        pnpm build:typecheck

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: web-dist
        path: apps/web/dist/
        retention-days: 7

  vercel-build:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up production Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: apps/web/package-lock.json

    - name: Install the Vercel dependency graph
      working-directory: apps/web
      run: npm ci --legacy-peer-deps

    - name: Audit the Vercel dependency graph
      working-directory: apps/web
      run: npm audit --audit-level=low

    - name: Build with the Vercel dependency graph
      working-directory: apps/web
      run: npm run build:typecheck

  ci-summary:
    runs-on: ubuntu-latest
    needs: [detect-changes, frontend-lint, ci-lint, backend-test, prefect-compatibility, production-images, frontend-test, frontend-build, vercel-build]
    if: always()
    steps:
    - name: Check CI results
      env:
        FRONTEND_LINT_RESULT: ${{ needs['frontend-lint'].result }}
        CI_LINT_RESULT: ${{ needs['ci-lint'].result }}
        BACKEND_TEST_RESULT: ${{ needs['backend-test'].result }}
        PREFECT_COMPATIBILITY_RESULT: ${{ needs['prefect-compatibility'].result }}
        PRODUCTION_IMAGES_RESULT: ${{ needs['production-images'].result }}
        FRONTEND_TEST_RESULT: ${{ needs['frontend-test'].result }}
        FRONTEND_BUILD_RESULT: ${{ needs['frontend-build'].result }}
        VERCEL_BUILD_RESULT: ${{ needs['vercel-build'].result }}
      run: |
        echo "Frontend lint: $FRONTEND_LINT_RESULT"
        echo "CI lint: $CI_LINT_RESULT"
        echo "Backend tests: $BACKEND_TEST_RESULT"
        echo "Prefect compatibility: $PREFECT_COMPATIBILITY_RESULT"
        echo "Production images: $PRODUCTION_IMAGES_RESULT"
        echo "Frontend tests: $FRONTEND_TEST_RESULT"
        echo "Frontend build: $FRONTEND_BUILD_RESULT"
        echo "Vercel build: $VERCEL_BUILD_RESULT"

        check_job() {
          local job_name="$1"
          local job_result="$2"
          if [[ "$job_result" == "success" || "$job_result" == "skipped" ]]; then
            return
          fi
          echo "::error::$job_name failed with result: $job_result"
          exit 1
        }

        check_job "frontend-lint" "$FRONTEND_LINT_RESULT"
        check_job "ci-lint" "$CI_LINT_RESULT"
        check_job "backend-test" "$BACKEND_TEST_RESULT"
        check_job "prefect-compatibility" "$PREFECT_COMPATIBILITY_RESULT"
        check_job "production-images" "$PRODUCTION_IMAGES_RESULT"
        check_job "frontend-test" "$FRONTEND_TEST_RESULT"
        check_job "frontend-build" "$FRONTEND_BUILD_RESULT"
        check_job "vercel-build" "$VERCEL_BUILD_RESULT"

        echo "All CI checks passed!"
