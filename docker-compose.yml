# zenstory - Quick Start
# ======================
# 1. export DEEPSEEK_API_KEY=your-key  (or put that line in a .env file next to this one)
# 2. docker compose up -d --build
# 3. Create the first account:
#    docker compose exec -e ZENSTORY_ADMIN_EMAIL=you@example.com \
#      -e ZENSTORY_ADMIN_PASSWORD='CHANGE-ME' server python scripts/create_admin.py
#    (use your own email, and a password of at least 12 characters)
# 4. Visit http://localhost:5173
#
# For production with PostgreSQL + Redis, use docker-compose.full.yml

services:
  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: zenstory-server
    restart: unless-stopped
    environment:
      # Required config for the writing agent — DeepSeek only
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Optional: a fixed secret (32+ characters) keeps people signed in across restarts
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      # SQLite on the zenstory_db volume, so accounts and projects survive
      # `docker compose down` and image rebuilds
      DATABASE_URL: sqlite:////app/db/zenstory.db
      # CORS for local dev
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "${SERVER_PORT:-8000}:8080"
    volumes:
      - zenstory_db:/app/db
      - zenstory_uploads:/app/uploads
      - zenstory_chroma:/app/chroma_data

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: zenstory-web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:${SERVER_PORT:-8000}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:5173"

volumes:
  zenstory_db:
  zenstory_uploads:
  zenstory_chroma:
