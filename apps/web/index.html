<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!--
          Static head for non-JS crawlers (GPTBot, ClaudeBot, PerplexityBot, Bingbot, …).
          Vercel serves this shell for every SPA route, so nothing route-specific
          (canonical, og:url) belongs here — react-helmet-async sets those per page
          once the app mounts, and Googlebot executes JS. This block only guarantees
          that a crawler that does NOT run JS still sees who publishes this site.
        -->
        <title>ZenStory AI — Open-source agent skills for story creation, adaptation and production</title>
        <meta name="description" content="ZenStory AI builds open-source, agent-native tools for stories in every form: Oh Story (web-fiction writing skills for Claude Code, Codex and other coding agents), Drama Skills (AI short drama and motion comics), Novel to Game, Video Recap Skills, and the ZenStory writing workbench." />

        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="ZenStory AI" />
        <meta property="og:title" content="ZenStory AI — Open-source agent skills for story creation, adaptation and production" />
        <meta property="og:description" content="Open-source, agent-native tools for creating and adapting stories — from web fiction and short drama to games and video. Create stories. Adapt them. Ship them." />
        <meta property="og:image" content="https://zenstory.ai/brand/zenstory-ai-mark.svg" />
        <meta property="og:locale" content="en_US" />
        <meta property="og:locale:alternate" content="zh_CN" />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="ZenStory AI" />
        <meta name="twitter:description" content="Open-source agent skills for story creation, adaptation and production." />
